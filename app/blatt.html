<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anleitungsblatt – RCC Lerntrainer</title>
<style>
@font-face{font-family:"Barlow Semi Condensed";src:url(fonts/BarlowSemiCondensed-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Barlow Semi Condensed";src:url(fonts/BarlowSemiCondensed-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Nunito";src:url(fonts/Nunito-VariableFont_wght.woff2) format("woff2");font-weight:200 1000}
:root{--navy:#004D7A;--karamell:#D9822B;--anthrazit:#2B3640;--grau:#5F6B75;--hell:#F1F3F5;--linie:#E1E5E9;--head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--body:"Nunito",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#E9ECEF;color:var(--anthrazit);font-family:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.leiste{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid var(--linie);font-size:14px;color:var(--grau)}
.leiste button{font:600 16px var(--head);background:var(--navy);color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
.seite{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:14mm 18mm 11mm;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.kopf{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--linie);padding-bottom:5mm}
.kopf img{height:15mm}
.kopf .titel{text-align:right}
.kopf .titel b{display:block;font:700 22pt/1.05 var(--head);color:var(--navy)}
.kopf .titel span{font-size:10.5pt;color:var(--grau)}
.eyebrow{font:700 10pt var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--karamell);margin:6mm 0 1mm}
h1{font:700 26pt/1.1 var(--head);color:var(--navy);margin:0 0 2mm}
.lead{font-size:11pt;margin:0 0 5mm;color:var(--anthrazit)}
.zugang{display:grid;grid-template-columns:56mm 1fr;gap:8mm;align-items:center;background:var(--hell);border-radius:5mm;padding:6mm}
.zugang svg{width:56mm;height:56mm;display:block;background:#fff;border-radius:3mm}
.zugang .lbl{font:600 10pt var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--grau);margin:0}
.zugang .code{font:700 30pt/1.1 var(--head);letter-spacing:3px;color:var(--navy);margin:1mm 0 5mm}
.zugang .url{font:600 12pt var(--body);color:var(--navy);overflow-wrap:anywhere;margin:1mm 0 5mm}
.zugang .klein{font-size:9.5pt;color:var(--grau);margin:0}
.schritte{list-style:none;margin:7mm 0 0;padding:0;display:grid;gap:3.5mm}
.schritte li{display:grid;grid-template-columns:12mm 1fr;gap:5mm;align-items:start}
.hex{width:12mm;height:10.4mm;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 15pt var(--head);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.schritte b{display:block;font:700 13.5pt/1.2 var(--head);color:var(--navy);margin-bottom:.5mm}
.schritte p{margin:0;font-size:10.5pt;line-height:1.45}
.notiz{margin-top:6mm;border:1.2px dashed var(--navy);border-radius:4mm;padding:5mm 6mm;display:grid;grid-template-columns:1fr 1fr;gap:3mm 10mm}
.notiz .k{grid-column:1/-1;font:700 11pt var(--head);color:var(--navy);margin:0}
.notiz .feld{font-size:10pt;color:var(--grau);border-bottom:1px solid var(--anthrazit);padding-top:5mm}
.notiz .hinweis{grid-column:1/-1;font-size:9pt;color:var(--grau);margin:0}
.fuss{margin-top:auto;padding-top:4mm;border-top:1px solid var(--linie);display:flex;justify-content:space-between;font-size:8.5pt;color:var(--grau)}
.fuss b{color:var(--navy)}
.fehler{max-width:560px;margin:60px auto;background:#fff;padding:24px;border-radius:8px}
@page{size:A4;margin:0}
@media print{html,body{background:#fff}.leiste{display:none}.seite{margin:0;box-shadow:none;width:210mm;min-height:0;height:296mm;overflow:hidden;break-after:avoid}}
</style>
</head>
<body>
<div class="leiste"><button id="drucken">Drucken oder als PDF speichern</button><span>Tipp: Im Druckdialog „Als PDF speichern“ wählen, Format A4, Ränder „Keine“.</span></div>
<div id="inhalt"></div>
<script src="vendor-qrcode.js"></script>
<script src="blatt.js"></script>
</body>
</html>
